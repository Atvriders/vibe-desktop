name: Build and publish Docker image

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Least privilege by default. `packages: write` is granted only to build-and-push,
# so the `test` job — which runs `npm ci` (arbitrary lifecycle scripts) against
# pull-request code — never holds a token that can publish to GHCR.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit, route and component tests
        run: npm test

      # Advisory only, on purpose. The outstanding next/postcss/sharp advisories have
      # no fix on a stable release (`npm audit fix` is a no-op; the first patched next
      # is a 16.3.0-preview) and none of them reach this app — no Server Actions, no
      # middleware.ts, no custom server, no next/image, and postcss is build-time only
      # and absent from the shipped standalone tree. This step surfaces NEW advisories
      # as a warning annotation without wedging the publish pipeline.
      - name: Audit production dependencies (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for the linux/arm64 leg on an amd64 runner. Pull requests build
      # linux/amd64 only (see platforms below), so emulation is pure waste there.
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build to prove the Dockerfile still compiles, but never push
          # (a fork's GITHUB_TOKEN has no packages:write) and skip the slow emulated arm64 leg.
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          tags: |
            ghcr.io/atvriders/vibe-desktop:latest
            ghcr.io/atvriders/vibe-desktop:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
